name: Desplegar Nebula Strike en Vercel

on:
  push:
    branches:
      - arena/01a0b0a6-project
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: nebula-strike-vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Despliegue de producción
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Desplegar en Vercel
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          output="$(npx --yes vercel@59.20.0 deploy --prod --yes --token "$VERCEL_TOKEN" --name nebula-strike-3d 2>&1)"
          printf '%s\n' "$output"
          deployment_url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -1)"
          test -n "$deployment_url"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Asociar dominio público estable
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.vercel.outputs.deployment_url }}
        run: |
          npx --yes vercel@59.20.0 alias set "$DEPLOYMENT_URL" nebula-strike-3d.vercel.app --token "$VERCEL_TOKEN"

      - name: Verificar contenido público y recursos PWA
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          public_url="https://nebula-strike-3d.vercel.app"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 \
            "$public_url/" --output "$workdir/index.html"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 \
            "$public_url/manifest.webmanifest" --output "$workdir/manifest.webmanifest"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 \
            "$public_url/sw.js" --output "$workdir/sw.js"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 \
            "$public_url/js/main.js" --output "$workdir/main.js"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 \
            "$public_url/libs/three.module.js" --output "$workdir/three.module.js"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 \
            "$public_url/assets/icons/icon.png" --output "$workdir/icon.png"

          grep -q '<title>Nebula Strike 3D</title>' "$workdir/index.html"
          grep -q '"name": "Nebula Strike 3D"' "$workdir/manifest.webmanifest"
          grep -q "const VERSION = 'nebula-v3'" "$workdir/sw.js"
          test "$(wc -c < "$workdir/main.js")" -gt 5000
          test "$(wc -c < "$workdir/three.module.js")" -gt 1000000
          test "$(wc -c < "$workdir/icon.png")" -gt 100000

          echo "public_url=$public_url" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Producción verificada: [$public_url]($public_url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Registrar URL del despliegue
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_URL: ${{ steps.verify.outputs.public_url }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f target_url="$PUBLIC_URL" \
            -f description="Nebula Strike 3D desplegado y verificado" \
            -f context="Vercel / Producción"
